  <script>
    function openPrefilledEmail() {
      const recipients = "info@moskvarium.ru,science@moskvarium.ru,pr@moskvarium.ru";
      const subject = "Urgent Welfare Consultation: Social Relocation Options for Naya (Orcinus orca) / Срочное обращение: вопрос социального перевода косатки Наи";
      const body = `Dear Moskvarium Directorate, Scientific Department, and Marine Mammal Care Team,

I am writing to formally urge your immediate attention and intervention regarding the critical situation of Naya, the solitary female killer whale (Orcinus orca) currently held at the Moskvarium facility in Moscow, Russia.

Following the loss of her previous tankmates, Naya is currently housed in complete social isolation. Killer whales are among the most cognitively advanced and socially dependent mammals on Earth — depriving this social species of conspecific companionship is known to cause severe psychological distress, immune vulnerability, and physical deterioration. For an animal of her social intelligence, ongoing isolation carries an acute risk of premature mortality.

While Moskvarium’s veterinary and care staff have worked exceptionally hard to maintain her daily health, Moskvarium, as her housing facility, has reached its limits in terms of the quality of care they can provide her:

Severe Environmental Constraints: As a mostly indoor facility, Moskvarium cannot provide enough natural sunlight (vital UV spectrums), dynamic climate, or the social enrichment required for the long-term well-being of a mature female orca.

Absence of Conspecific Social Bonds: Artificial enrichment and human interaction cannot substitute for a social order of killer whales. Long-term isolation is biologically untenable for her.

Naya’s duration in captivity thus far combined with the health history of a captive, habituated cetacean makes an immediate sea-pen release or open-ocean release impossible without complex factors such as multiple years’ worth of funding and resources, and additionally, a location suitable to her in terms of pathogen transfer, or harsh natural conditions. The most humane, scientifically grounded, and immediate solution for Naya is a facility-to-facility transfer into an established social group.

Multiple facilities globally hold the infrastructure, veterinary capacity, and specific social environments required to integrate Naya into an existing pod:

1. Chimelong Ocean Kingdom & Shanghai Haichang Ocean Park (China):

Exact Biological & Ecotype Match: Both facilities house Russian transient killer whales—Naya’s exact wild ecotype— all of whom originate from the same Sea of Okhotsk.

Social Integration & Calf Rearing: Both parks operate multi-generational pods and active maternal social structures. Given Naya’s personal history of birthing and maternal care, she has the behavioral experience to naturally integrate as an allomother (helping care for and raise calves alongside other females) without disrupting any pod dynamics.

Modern Infrastructure: These facilities offer tanks similar to the size of that at Moskvarium, suited to orcas of Naya’s population, and Chimelong Ocean Kingdom also features a wave machine. Both facilities have natural light via a sun roof or other measures.

2. Port of Nagoya Public Aquarium (Japan):
Resolving Dual Isolation: Following the loss of the male orca Earth, Nagoya’s young female orca, Lynn, currently resides without an orca companion. An international transfer and pairing between Naya and Lynn would simultaneously resolve the social isolation crises of two solitary females in this specific region.

3. Loro Parque & European Zoological Institutions (EAZA / AIZA):

Veterinary & Behavioral Specialization:
This is a European accredited aquarium that maintains leading protocols in cetacean social dynamics, acoustic monitoring, and veterinary medicine, and is capable of supporting complex welfare transitions.

We respectfully urge your office to take the following steps:

1. Facilitate Inter-Facility Dialogue: Initiate or support urgent exploratory consultations between Moskvarium’s management, international marine mammal curators, and receiving facilities regarding transfer feasibility.

2. Expedite Regulatory and CITES Cooperation: Support and streamline the necessary scientific evaluations, veterinary health protocols, and CITES import/export permits required for cross-border transport.

3. Prioritize Long-Term Animal Welfare: Recognize that immediate collaborative action will safeguard an irreplaceable animal, whereas continued inaction risks losing Naya entirely to preventable isolation-related decline.

Time is of the essence for Naya. The facilities exist, the biological compatibility is clear, and the international transport logistics are proven. We urge you to use your authority to help secure her future within a thriving pod.

Thank you for your time, consideration, and urgent dedication to marine mammal welfare.

Sincerely,
[Your Name]
[Your City, Country]
[Your Email / Contact Information]

---

Уважаемое руководство, научный отдел и команда тренеров «Москвариума»,

Я пишу вам, чтобы официально привлечь ваше безотлагательное внимание и призвать к вмешательству в критическую ситуацию вокруг Наи — одинокой самки косатки (Orcinus orca), которая в настоящее время содержится в центре океанографии и морской биологии «Москвариум» в Москве (Россия).

После утраты своих прежних сородичей Ная находится в условиях полной социальной изоляции. Косатки — одни из самых высокоинтеллектуальных и социально зависимых млекопитающих на Земле: лишение этого социального вида общения с представителями своего рода вызывает тяжёлый психологический стресс, ослабление иммунитета и физическое истощение. Для животного с таким уровнем социального интеллекта длительная изоляция несёт в себе острый риск преждевременной гибели.

Несмотря на то что ветеринарный персонал и тренеры «Москвариума» прилагают огромные усилия для поддержания её ежедневного здоровья, сам комплекс как место содержания исчерпал свои возможности в плане качества условий, которые он может ей обеспечить:

- Серьёзные ограничения среды: Будучи преимущественно закрытым крытым комплексом, «Москвариум» не может обеспечить достаточное количество естественного солнечного света (жизненно важного УФ-спектра), динамичных климатических условий или социального обогащения среды, необходимых для долгосрочного благополучия взрослой самки косатки.
- Отсутствие внутривидовых социальных связей: Искусственное обогащение среды и взаимодействие с людьми не могут заменить естественную социальную иерархию косаток. Длительная изоляция для неё биологически неприемлема.

Продолжительность пребывания Наи в неволе в сочетании с анамнезом животного, привыкшего к уходу человека, делает немедленный выпуск в морской вольер или открытый океан невозможным без учёта множества сложных факторов — таких как многолетнее финансирование и ресурсы, а также наличие подходящей акватории с точки зрения рисков передачи патогенов или суровых природных условий. Наиболее гуманным, научно обоснованным и безотлагательным решением для Наи является перевод из одного океанариума в другой — в уже сформированную социальную группу.

В мире существует несколько комплексов, обладающих необходимой инфраструктурой, ветеринарным потенциалом и специфической социальной средой для интеграции Наи в существующую группу:

1. Chimelong Ocean Kingdom и Shanghai Haichang Ocean Park (Китай):
- Полное биологическое и экотипическое совпадение: В обоих комплексах содержатся российские плотоядные косатки — того же самого дикого экотипа, к которому принадлежит Ная, и все они происходят из Охотского моря.
- Социальная интеграция и забота о потомстве: В обоих парках сформированы разновозрастные группы и активные материнские социальные структуры. Учитывая собственный опыт родов и материнской заботы, Ная обладает необходимыми поведенческими навыками, чтобы естественным образом интегрироваться в качестве алломатери (помогая другим самкам выкармливать и растить детёнышей), не нарушая при этом групповую динамику.
- Современная инфраструктура: Эти комплексы располагают бассейнами, сопоставимыми по размерам с бассейном «Москвариума» и подходящими для косаток популяции Наи, а в Chimelong Ocean Kingdom также установлена генераторная волновая система. В обоих комплексах обеспечено естественное освещение через световые люки в крыше или иные конструктивные решения.

2. Публичный аквариум порта Нагоя (Япония):
- Решение проблемы двойной изоляции: После смерти самца косатки по кличке Эрт (Earth) молодая самка Линн в Нагое в настоящее время живёт без сородичей. Международный перевод и объединение Наи и Линн позволили бы одновременно разрешить кризис социальной изоляции сразу двух одиноких самок в данном регионе.

3. Loro Parque и европейские зоологические учреждения (EAZA / AIZA):
- Ветеринарная и поведенческая специализация: Это аккредитованный в Европе океанариум, придерживающийся передовых протоколов в области социальной динамики китообразных, акустического мониторинга и ветеринарной медицины, и способный обеспечить сопровождение сложных процессов адаптации и повышения благополучия животных.

Мы настоятельно просим ваше ведомство предпринять следующие шаги:

1. Содействовать диалогу между учреждениями: Инициировать или поддержать срочные предварительные консультации между руководством «Москвариума», международными кураторами морских млекопитающих и принимающими океанариумами относительно возможности такого перевода.
2. Ускорить нормативное и межведомственное взаимодействие в рамках СИТЕС (CITES): Оказать поддержку и оптимизировать проведение необходимых научных оценок, ветеринарно-санитарных протоколов и оформление экспортно-импортных разрешений СИТЕС, требуемых для трансграничной перевозки.
3. Поставить в приоритет долгосрочное благополучие животного: Признать, что незамедлительные совместные действия позволят спасти незаменимое животное, тогда как дальнейшее бездействие грозит полной потерей Наи из-за предотвратимого ухудшения состояния, вызванного изоляцией.

Для Наи время имеет решающее значение. Подходящие комплексы существуют, биологическая совместимость очевидна, а логистика международных перевозок отработана. Мы призываем вас использовать ваши полномочия, чтобы помочь обеспечить ей будущее в благополучной социальной группе.

Благодарим вас за уделённое время, внимание и безотлагательную приверженность делу защиты и благополучия морских млекопитающих.

С глубоким уважением,

[Your Name]
